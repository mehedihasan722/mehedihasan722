<ellipse rx="118" ry="39" transform="rotate(48)" fill="none" stroke="#c4b5fd" stroke-opacity=".5"/>
<circle cx="118" cy="-79" r="9" fill="#d5ff70"/>
<path d="M-20-17L-40 0L-20 17M20-17L40 0L20 17M9-26L-9 26" fill="none" stroke="#f5f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
