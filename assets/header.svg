<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Mehedi Hasan — Software developer</title>
<desc id="desc">Midnight purple banner with lime accents and an orbital illustration. Thoughtful interfaces. Useful software.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14151f"/><stop offset="1" stop-color="#272039"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#c4b5fd"/><stop offset=".55" stop-color="#8070c5"/><stop offset="1" stop-color="#39304f"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<path d="M48 46H1152" stroke="#ffffff" stroke-opacity=".12"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="52" y="31" fill="#d5ff70" font-size="12" letter-spacing="3">MH / DEVELOPER</text>
<text x="1150" y="31" text-anchor="end" fill="#a9a6bb" font-size="11" letter-spacing="2">BANGLADESH · ONLINE</text>
<text x="60" y="112" fill="#c4b5fd" font-size="13" letter-spacing="4">HELLO, I'M</text>
<text x="54" y="200" fill="#f5f3ff" font-size="80" font-weight="700" letter-spacing="-4">Mehedi Hasan<tspan fill="#d5ff70">.</tspan></text>
<text x="60" y="253" fill="#c9c5d8" font-size="25">Thoughtful interfaces. Useful software.</text>
<rect x="60" y="298" width="255" height="40" rx="20" fill="#d5ff70"/>
<text x="187" y="323" text-anchor="middle" fill="#14151f" font-size="12" font-weight="700" letter-spacing="2">LEARN. BUILD. IMPROVE.</text>
<text x="60" y="388" fill="#9691a8" font-size="11" letter-spacing="2">WEB + MOBILE / REAL-TIME SYSTEMS / XAI</text>
</g>
<g transform="translate(985 217)">
<circle r="130" fill="none" stroke="#c4b5fd" stroke-opacity=".16"/>
<circle r="103" fill="none" stroke="#c4b5fd" stroke-opacity=".2" stroke-dasharray="3 9"/>
<circle r="73" fill="url(#orb)"/>
